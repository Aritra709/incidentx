[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentx"
version = "0.1.0"
description = "Autonomous IT incident response for small teams with no on-call engineer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aritra Barman" }]
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "networkx>=3.0",
  "requests>=2.31",
  "pandas>=2.0",
  "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
incidentx = "incidentx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
