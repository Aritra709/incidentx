[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentx"
version = "0.1.0"
description = "Autonomous IT incident response for small teams with no on-call engineer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aritra Barman" }]
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "networkx>=3.0",
  "requests>=2.31",
  "pandas>=2.0",
  "streamlit>=1.47",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
incidentx = "incidentx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"scripts/demo.py" = ["E402"]
"scripts/benchmark.py" = ["E402"]
